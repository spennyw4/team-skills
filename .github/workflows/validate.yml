name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate marketplace and plugins
        run: python3 scripts/validate_marketplace.py
