<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Showreel</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; position: absolute; inset: 0; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  CLAUDE — MOTION SHOWREEL '26
//  15s @ 60fps, 128 BPM (8 bars). Everything is procedural; renderFrame(f) is
//  deterministic so the reel can be rendered frame-by-frame with motion blur.
// ─────────────────────────────────────────────────────────────────────────────
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const FPS = 60, DUR = 15, BPM = 128, B = 60 / BPM, BAR = 4 * B;
const TAU = Math.PI * 2;
const RENDER = location.search.includes('render');
const SUBS = RENDER ? 6 : 1;      // motion-blur sub-frames
const SHUTTER = 0.5;               // 180° shutter

const COL = {
  ink: '#0B0B0F', paper: '#F4F0E8', coral: '#FF5B2E', blue: '#2C3DFF', acid: '#D9FF3B',
};
const RGB = { ink: [11, 11, 15], paper: [244, 240, 232], coral: [255, 91, 46], blue: [44, 61, 255] };
const SIDE = { [COL.coral]: '#A8361A', [COL.blue]: '#18238F', [COL.paper]: '#8F8B84', [COL.acid]: '#7E9A12' };
const DISPLAY = '"Inter Display", Inter, sans-serif';
const MONO = '"DejaVu Sans Mono", monospace';
const font = (px, w = 900, fam = DISPLAY) => `${w} ${px}px ${fam}`;

// ── math ────────────────────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1,
};
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ── drawing helpers ─────────────────────────────────────────────────────────
function bg(ctx, c) { ctx.fillStyle = c; ctx.fillRect(-400, -400, W + 800, H + 800); }

function layoutWord(ctx, word, size, cx, track = 0, w = 900) {
  ctx.save(); ctx.font = font(size, w);
  const tr = track * size, n = word.length;
  const full = ctx.measureText(word).width + tr * (n - 1);
  const x0 = cx - full / 2, boxes = [];
  for (let i = 0; i < n; i++) {
    const xi = x0 + ctx.measureText(word.slice(0, i)).width + tr * i;
    const wi = ctx.measureText(word[i]).width;
    boxes.push({ x: xi, w: wi, cx: xi + wi / 2 });
  }
  ctx.restore();
  return { boxes, full, x0, cap: size * 0.727 };
}
function fitSize(ctx, word, maxW, maxSize) {
  ctx.save(); ctx.font = font(100); const w = ctx.measureText(word).width; ctx.restore();
  return Math.min(maxSize, maxW / w * 100);
}
// Draw a word letter-by-letter. fn(i,n) → {dx,dy,s,sx,sy,r,a}
function drawWord(ctx, word, size, cx, cy, color, fn = null, o = {}) {
  const L = layoutWord(ctx, word, size, cx, o.track || 0, o.w || 900);
  ctx.save(); ctx.font = font(size, o.w || 900); ctx.fillStyle = color; ctx.textBaseline = 'alphabetic';
  if (o.mask) {
    const pad = size * (o.maskPad ?? 0.14);
    ctx.beginPath(); ctx.rect(-400, cy - L.cap / 2 - pad, W + 800, L.cap + pad * 2); ctx.clip();
  }
  for (let i = 0; i < word.length; i++) {
    const p = fn ? fn(i, word.length) : {};
    const a = p.a ?? 1; if (a <= 0.001) continue;
    const b = L.boxes[i];
    ctx.save(); ctx.globalAlpha *= a;
    const base = o.anchor === 'base';
    ctx.translate(b.cx + (p.dx || 0), (base ? cy + L.cap / 2 : cy) + (p.dy || 0));
    if (p.r) ctx.rotate(p.r);
    const s = p.s ?? 1; ctx.scale(s * (p.sx ?? 1), s * (p.sy ?? 1));
    ctx.fillText(word[i], -b.w / 2, base ? 0 : L.cap / 2);
    ctx.restore();
  }
  ctx.restore();
  return L;
}
function monoText(ctx, str, x, y, size, color, align = 'left', alpha = 1, w = 500) {
  ctx.save(); ctx.font = font(size, w, MONO); ctx.fillStyle = color; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.globalAlpha *= alpha; ctx.fillText(str, x, y); ctx.restore();
}
function typed(str, p) { return str.slice(0, Math.floor(str.length * clamp(p))); }

// ── camera shake ────────────────────────────────────────────────────────────
const HITS = [[0.94, 10], [BAR, 10], [BAR + B, 6], [BAR + 2 * B, 6], [BAR + 3 * B, 8], [2 * BAR, 16], [3 * BAR, 14],
  [4 * BAR, 12], [5 * BAR, 14], [5 * BAR + 2 * B, 6], [5 * BAR + 3 * B, 10], [6 * BAR, 10], [7 * BAR, 26]];
function shake(t) {
  let x = 0, y = 0, r = 0;
  for (const [ti, a] of HITS) {
    const d = t - ti; if (d < 0 || d > 0.7) continue;
    const k = a * Math.exp(-d * 8);
    x += k * Math.sin(d * 83 + ti); y += k * Math.cos(d * 61 + ti * 2); r += k * 0.0009 * Math.sin(d * 47);
  }
  return { x, y, r };
}

// ═════════════════════════════════════════════════════════════════════════════
//  SCENE 1 — the dot, the line, the slit (0 → 1 bar)
// ═════════════════════════════════════════════════════════════════════════════
function s1(ctx, u) {
  bg(ctx, COL.ink);
  const open = E.inOutExpo(prog(u, 0.92, 1.3));
  const gap = open * (H + 40);
  if (gap > 0.5) { ctx.fillStyle = COL.coral; ctx.fillRect(-400, CY - gap / 2, W + 800, gap); }

  // grid dots in the dark, fading as the slit opens
  const gd = prog(u, 0.1, 0.5) * (1 - open);
  if (gd > 0) {
    ctx.fillStyle = COL.paper;
    for (let x = 60; x < W; x += 60) for (let y = 60; y < H; y += 60) {
      const d = Math.hypot(x - CX, y - CY) / 1100;
      const a = gd * clamp(1 - d * 1.3) * 0.22 * smooth(0, 0.2, u - d * 0.4);
      if (a <= 0) continue; ctx.globalAlpha = a; ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
  }

  const lp = E.outExpo(prog(u, 0.47, 0.95));
  if (lp > 0) {
    ctx.fillStyle = COL.paper; const th = 4;
    if (open <= 0) { const L = lp * (W / 2 + 200); ctx.fillRect(CX - L, CY - th / 2, 2 * L, th); }
    else { ctx.fillRect(-400, CY - gap / 2 - th, W + 800, th); ctx.fillRect(-400, CY + gap / 2, W + 800, th); }
  }
  // ring burst when the dot fires the line
  const rb = prog(u, 0.47, 1.1);
  if (rb > 0 && rb < 1) {
    ctx.strokeStyle = COL.coral; ctx.lineWidth = 3 * (1 - rb) + 0.5; ctx.globalAlpha = 1 - rb;
    ctx.beginPath(); ctx.arc(CX, CY, 20 + 420 * E.outExpo(rb), 0, TAU); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(CX, CY, 20 + 260 * E.outExpo(prog(u, 0.52, 1.1)), 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // the dot
  const ds = E.outBack(prog(u, 0.03, 0.3)) * (1 - E.inExpo(prog(u, 0.47, 0.62)));
  const pulse = u > B * 0.5 ? 0 : 0;
  if (ds > 0) { ctx.fillStyle = COL.coral; ctx.beginPath(); ctx.arc(CX, CY, 18 * ds + pulse, 0, TAU); ctx.fill(); }

  // CLAUDE title behind the slit
  if (open > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(-400, CY - gap / 2, W + 800, gap); ctx.clip();
    const size = 340;
    const L = drawWord(ctx, 'CLAUDE', size, CX, CY - 20, COL.ink, (i) => {
      const p = E.outExpo(prog(u, 0.98 + i * 0.04, 1.42 + i * 0.04));
      const q = E.inExpo(prog(u, 1.46 + i * 0.025, 1.72 + i * 0.025));
      return { dy: (1 - p) * size * 1.0 - q * size * 1.0 };
    }, { mask: true, track: -0.02 });
    const sub = 'MOTION DESIGN — SHOWREEL 2026';
    const sp = prog(u, 1.12, 1.4), sq = prog(u, 1.5, 1.62);
    monoText(ctx, typed(sub, sp) + (sp < 1 ? '█' : ''), CX, CY + 200, 26, COL.ink, 'center', 1 - sq);
    // little registration marks inside the coral
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.globalAlpha = (1 - sq) * prog(u, 1.1, 1.25);
    const lx = CX - L.full / 2 - 40, rx = CX + L.full / 2 + 40, ty = CY - 20 - L.cap / 2 - 30, by = CY - 20 + L.cap / 2 + 30;
    for (const [x, y, sx, sy] of [[lx, ty, 1, 1], [rx, ty, -1, 1], [lx, by, 1, -1], [rx, by, -1, -1]]) {
      ctx.beginPath(); ctx.moveTo(x, y + sy * 28); ctx.lineTo(x, y); ctx.lineTo(x + sx * 28, y); ctx.stroke();
    }
    ctx.restore();
  }
  // circle wipe into scene 2
  const cw = E.inOutExpo(prog(u, 1.56, BAR));
  if (cw > 0) {
    ctx.fillStyle = COL.paper; ctx.beginPath(); ctx.arc(CX, CY, cw * 1150, 0, TAU); ctx.fill();
    ctx.strokeStyle = COL.coral; ctx.lineWidth = 10 * (1 - cw);
    ctx.beginPath(); ctx.arc(CX, CY, cw * 1150 + 30 * (1 - cw), 0, TAU); ctx.stroke();
  }
}

// ═════════════════════════════════════════════════════════════════════════════
//  SCENE 2 — kinetic type: I / MAKE / THINGS / MOVE●
// ═════════════════════════════════════════════════════════════════════════════
const S2W = [
  { w: 'I', bg: COL.paper, fg: COL.ink, ln: COL.coral },
  { w: 'MAKE', bg: COL.blue, fg: COL.paper, ln: COL.acid },
  { w: 'THINGS', bg: COL.coral, fg: COL.ink, ln: COL.paper },
  { w: 'MOVE', bg: COL.paper, fg: COL.ink, ln: COL.coral },
];
function skewWipe(ctx, color, p, dir = 1) {
  if (p <= 0) return;
  const x = lerp(W + 400, -500, p) * dir + (dir < 0 ? W : 0);
  ctx.fillStyle = color; ctx.beginPath();
  if (dir > 0) { ctx.moveTo(x, -400); ctx.lineTo(W + 800, -400); ctx.lineTo(W + 800, H + 400); ctx.lineTo(x - 300, H + 400); }
  ctx.closePath(); ctx.fill();
}
function s2(ctx, u) {
  const k = Math.min(3, Math.floor(u / B)), v = u - k * B, cur = S2W[k];
  const prev = S2W[Math.max(0, k - 1)];
  bg(ctx, prev.bg);
  const wp = k === 0 ? 1 : E.outExpo(prog(v, 0, 0.16));
  // trailing accent stripe in the wipe
  if (k > 0 && wp < 1) skewWipe(ctx, COL.acid === cur.bg ? COL.coral : COL.acid, E.outExpo(prog(v, 0, 0.12)));
  skewWipe(ctx, cur.bg, wp);
  if (k === 0) bg(ctx, cur.bg);

  const size = fitSize(ctx, cur.w, k === 3 ? 1300 : 1500, 500);
  const cy = CY + 10;
  // tiny index label
  monoText(ctx, `[ 0${k + 1} / 04 ]`, 120, 170, 22, cur.fg, 'left', prog(v, 0.04, 0.1));
  monoText(ctx, ['SUBJECT', 'VERB', 'OBJECT', 'VERB'][k], W - 120, 170, 22, cur.fg, 'right', prog(v, 0.04, 0.1));

  ctx.save();
  if (k < 3) {
    const sc = 1 + 0.18 * (1 - E.outExpo(prog(v, 0, 0.4)));
    ctx.translate(CX, cy); ctx.scale(sc, sc); ctx.translate(-CX, -cy);
    const L = drawWord(ctx, cur.w, size, CX, cy, cur.fg, (i) => {
      const p = E.outExpo(prog(v, 0.0 + i * 0.022, 0.3 + i * 0.022));
      return { dy: (1 - p) * size * 0.95 };
    }, { mask: true, track: -0.01 });
    const lp = E.outExpo(prog(v, 0.06, 0.4));
    ctx.fillStyle = cur.ln; ctx.fillRect(CX - L.full / 2, cy + L.cap / 2 + 40, L.full * lp, 10);
  } else {
    // MOVE + a geometric dot we can dive into
    const L = layoutWord(ctx, 'MOVE', size, CX - size * 0.12, -0.01);
    const r = size * 0.11;
    const dotX = L.x0 + L.full + size * 0.06 + r, dotY = cy + L.cap / 2 - r;
    const z = E.inExpo(prog(v, 0.2, B - 0.005));
    const S = 1 + z * 160;
    ctx.translate(dotX, dotY); ctx.scale(S, S); ctx.translate(-dotX, -dotY);
    drawWord(ctx, 'MOVE', size, CX - size * 0.12, cy, cur.fg, (i) => {
      const p = prog(v, i * 0.03, 0.2 + i * 0.03);
      const s = E.outBack(p);
      const land = Math.exp(-Math.max(0, v - (0.12 + i * 0.03)) * 18);
      return { s, sy: 1 + 0.25 * land * Math.sin(v * 50), sx: 1 - 0.15 * land * Math.sin(v * 50), r: (1 - E.outCubic(p)) * (i % 2 ? 0.4 : -0.4) };
    }, { anchor: 'base', track: -0.01 });
    const dp = E.outBack(prog(v, 0.1, 0.24));
    ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(dotX, dotY - (1 - dp) * 200, r * dp, 0, TAU); ctx.fill();
    ctx.restore();
    if (z > 0.985) bg(ctx, COL.ink);
    return;
  }
  ctx.restore();
}

// ═════════════════════════════════════════════════════════════════════════════
//  SCENE 3 — systems: a morphing grid that tips into extruded isometric
// ═════════════════════════════════════════════════════════════════════════════
const GRID = [];
for (let j = 0; j < 9; j++) for (let i = 0; i < 16; i++) {
  const gx = (i - 7.5) * 120, gy = (j - 4) * 120;
  GRID.push({ gx, gy, d: Math.hypot(gx, gy) / Math.hypot(900, 480), i, j });
}
function shapePath(ctx, s, round) {
  ctx.beginPath(); ctx.roundRect(-s, -s, 2 * s, 2 * s, Math.max(0, round * s));
}
function s3(ctx, u) {
  bg(ctx, COL.ink);
  const iso = E.inOutCubic(prog(u, 0.5, 1.15));
  const rot = iso * Math.PI / 4, syc = 1 - 0.43 * iso, gsc = 1 - 0.2 * iso;
  const col = prog(u, 1.4, 1.8);
  const a = Math.cos(rot) * gsc, b = Math.sin(rot) * syc * gsc, c = -Math.sin(rot) * gsc, d = Math.cos(rot) * syc * gsc;
  const cells = [];
  for (const g of GRID) {
    const pop = E.outBack(prog(u, g.d * 0.4, 0.28 + g.d * 0.4));
    if (pop <= 0) continue;
    const w = 0.5 + 0.5 * Math.sin(u * 7.5 - g.d * 10);
    const cl = E.inExpo(prog(col, (1 - g.d) * 0.35, 0.65 + (1 - g.d) * 0.35));
    let sx = CX + a * g.gx + c * g.gy, sy = CY + b * g.gx + d * g.gy;
    sx = lerp(sx, CX, cl); sy = lerp(sy, CY, cl);
    const s = 44 * pop * (0.6 + 0.4 * w) * (1 - cl);
    if (s < 0.3) continue;
    const h = iso * (1 - cl) * Math.pow(w, 2) * 130;
    const color = w > 0.78 ? COL.coral : w < 0.22 ? COL.blue : (g.i + g.j) % 7 === 0 ? COL.acid : COL.paper;
    cells.push({ sx, sy, s, h, w, color, rr: (1 - w) * 1.0, sr: w * Math.PI / 2 });
  }
  cells.sort((p, q) => p.sy - q.sy);
  for (const cl of cells) {
    // extrusion: stack of slices in the side colour
    if (cl.h > 1) {
      ctx.fillStyle = SIDE[cl.color];
      for (let y = 0; y < cl.h; y += 3) {
        ctx.setTransform(a, b, c, d, cl.sx, cl.sy - y); ctx.rotate(cl.sr); shapePath(ctx, cl.s, cl.rr); ctx.fill();
      }
    }
    ctx.setTransform(a, b, c, d, cl.sx, cl.sy - cl.h); ctx.rotate(cl.sr);
    ctx.fillStyle = cl.color; shapePath(ctx, cl.s, cl.rr); ctx.fill();
    if (cl.color === COL.paper && iso > 0.5) { ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; shapePath(ctx, cl.s * 0.55, cl.rr); ctx.stroke(); }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // the seed: a coral square spinning up at the centre
  const seed = E.outBack(prog(u, 1.55, 1.85));
  if (seed > 0) {
    ctx.save(); ctx.translate(CX, CY); ctx.rotate((1 - seed) * 3 + u * 2);
    ctx.fillStyle = COL.coral; const s = 36 * seed; ctx.fillRect(-s, -s, 2 * s, 2 * s); ctx.restore();
  }
}

// ═════════════════════════════════════════════════════════════════════════════
//  SCENE 4 — particles: burst → sphere → torus knot → implode
// ═════════════════════════════════════════════════════════════════════════════
const NP = 2600, P = [];
{
  const R = rng(7);
  for (let i = 0; i < NP; i++) {
    const y = 1 - 2 * (i + 0.5) / NP, rr = Math.sqrt(1 - y * y), th = i * 2.399963;
    const sph = [Math.cos(th) * rr * 340, y * 340, Math.sin(th) * rr * 340];
    const s = (i / NP) * TAU, p = 2, q = 3, kr = Math.cos(q * s) + 2.3;
    const tub = [(R() - .5) * 46, (R() - .5) * 46, (R() - .5) * 46];
    const knot = [kr * Math.cos(p * s) * 125 + tub[0], kr * Math.sin(p * s) * 125 + tub[1], -Math.sin(q * s) * 160 + tub[2]];
    const u1 = R() * 2 - 1, ph = R() * TAU, m = Math.sqrt(1 - u1 * u1), mag = 320 + 900 * Math.pow(R(), 0.6);
    const exp = [Math.cos(ph) * m * mag, u1 * mag, Math.sin(ph) * m * mag];
    const start = [(R() - .5) * 72, (R() - .5) * 72, (R() - .5) * 20];
    const c = R();
    P.push({ sph, knot, exp, start, dl: R(), color: c < 0.7 ? COL.paper : c < 0.88 ? COL.coral : COL.acid, sz: 0.6 + R() * 0.9 });
  }
}
function rot3(v, ay, ax) {
  const [x, y, z] = v, cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
  const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
  return [x1, y * cx - z1 * sx, y * sx + z1 * cx];
}
function s4(ctx, u) {
  bg(ctx, COL.ink);
  const ay = u * 1.5 + 0.4, ax = 0.42 + 0.15 * Math.sin(u * 1.3);
  const imp = E.inExpo(prog(u, 1.42, 1.72));
  const pts = new Array(NP);
  for (let i = 0; i < NP; i++) {
    const p = P[i];
    const e = E.outExpo(prog(u, 0, 0.55));
    let v = [lerp(p.start[0], p.exp[0], e), lerp(p.start[1], p.exp[1], e), lerp(p.start[2], p.exp[2], e)];
    // curl-ish swirl while free
    const sw = (1 - prog(u, 0.3, 0.9)) * e * 60;
    v[0] += Math.sin(v[1] * 0.006 + u * 3) * sw; v[1] += Math.sin(v[2] * 0.006 + u * 3.3) * sw; v[2] += Math.sin(v[0] * 0.006 + u * 2.7) * sw;
    const k1 = E.inOutCubic(prog(u, 0.28 + p.dl * 0.25, 0.75 + p.dl * 0.25));
    v = [lerp(v[0], p.sph[0], k1), lerp(v[1], p.sph[1], k1), lerp(v[2], p.sph[2], k1)];
    const k2 = E.inOutCubic(prog(u, 1.0 + p.dl * 0.18, 1.32 + p.dl * 0.18));
    v = [lerp(v[0], p.knot[0], k2), lerp(v[1], p.knot[1], k2), lerp(v[2], p.knot[2], k2)];
    const ii = clamp(imp * (1.25 - p.dl * 0.25));
    v = [v[0] * (1 - ii), v[1] * (1 - ii), v[2] * (1 - ii)];
    const r = rot3(v, ay, ax);
    const s = 1100 / (1100 + r[2]);
    pts[i] = { x: CX + r[0] * s, y: CY + r[1] * s, z: r[2], s, p };
  }
  pts.sort((p, q) => q.z - p.z);
  for (const q of pts) {
    const near = clamp(0.5 - q.z / 800);
    ctx.globalAlpha = 0.3 + 0.7 * near;
    ctx.fillStyle = q.p.color;
    const sz = (2.2 + 2.6 * q.p.sz) * q.s;
    ctx.fillRect(q.x - sz / 2, q.y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
  // orbit rings while it's a sphere
  const ringA = prog(u, 0.55, 0.8) * (1 - prog(u, 1.0, 1.2));
  if (ringA > 0) {
    for (let k = 0; k < 2; k++) {
      ctx.strokeStyle = k ? COL.acid : COL.coral; ctx.lineWidth = 2; ctx.globalAlpha = ringA;
      const trim = E.outExpo(prog(u, 0.55 + k * 0.08, 1.0));
      ctx.beginPath();
      for (let j = 0; j <= 160 * trim; j++) {
        const a = j / 160 * TAU + u * (k ? -1 : 1);

  if (!VIG) { VIG = ctx.createRadialGradient(CX, CY, 520, CX, CY, 1250); VIG.addColorStop(0, 'rgba(0,0,0,0)'); VIG.addColorStop(1, 'rgba(0,0,0,0.24)'); }
  ctx.fillStyle = VIG; ctx.fillRect(0, 0, W, H);
}

const SCENES = [s1, s2, s3, s4, s5, s6, s7, s8];
function drawScene(ctx, t) {
  ctx.save();
  const sh = shake(t);
  ctx.translate(CX + sh.x, CY + sh.y); ctx.rotate(sh.r); ctx.translate(-CX, -CY);
  const i = Math.min(7, Math.floor(t / BAR));
  SCENES[i](ctx, t - i * BAR);
  ctx.restore();
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const sub = document.createElement('canvas'); sub.width = W; sub.height = H; const sctx = sub.getContext('2d');
const acc = document.createElement('canvas'); acc.width = W; acc.height = H; const actx = acc.getContext('2d');
function renderFrame(f) {
  const t0 = f / FPS;
  for (let s = 0; s < SUBS; s++) {
    const t = Math.min(DUR - 1e-4, t0 + (s / SUBS) * SHUTTER / FPS);
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.globalAlpha = 1; sctx.globalCompositeOperation = 'source-over';
    drawScene(sctx, t);
    actx.globalAlpha = 1 / (s + 1); actx.drawImage(sub, 0, 0);
  }
  ctx.drawImage(acc, 0, 0);
  hud(ctx, t0);
  finish(ctx, f);
}
window.renderFrame = renderFrame;
window.ready = Promise.all([document.fonts.load(font(100, 900)), document.fonts.load(font(20, 500, MONO))]);

if (!RENDER) {
  window.ready.then(() => {
    const start = performance.now();
    const loop = () => { const t = ((performance.now() - start) / 1000) % DUR; renderFrame(Math.floor(t * FPS)); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
